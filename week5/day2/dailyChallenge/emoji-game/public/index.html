<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Guessing Game</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Emoji Guessing Game</h1>
      <div class="badges">
        <span id="score-display">Score: 0</span>
        <span id="timer-display">15s</span>
      </div>
    </header>

    <section class="card">
      <div id="emoji-display" class="emoji-box" aria-live="polite">😀</div>
      <p id="hint-display" class="hint hidden"></p>

      <form id="guess-form">
        <div id="options-container" class="options"></div>

        <div class="button-row">
          <button id="submit-btn" type="submit" disabled>Submit Guess</button>
          <button id="hint-btn" type="button" class="btn-secondary">Show Hint</button>
          <button id="next-btn" type="button" class="btn-secondary hidden">Next Emoji</button>
        </div>
      </form>

      <div id="feedback-box" class="feedback hidden"></div>
    </section>

    <section class="card">
      <h2>Leaderboard</h2>
      <form id="leaderboard-form" class="leaderboard-form">
        <input
          id="player-name"
          type="text"
          placeholder="Enter your name to save score"
          maxlength="20"
          required
        />
        <button type="submit">Save Score</button>
      </form>
      <ol id="leaderboard-list" class="leaderboard-list"></ol>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
