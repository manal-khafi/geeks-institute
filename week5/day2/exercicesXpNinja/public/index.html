<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Express Node.js Quiz Game</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="container">
    <header class="top-bar">
      <h1>Node &amp; Express Quiz</h1>
      <div class="stats">
        <span id="progress">Question 1 / 5</span>
        <span id="score-badge">Score: 0</span>
        <span id="timer-badge">Time: 20s</span>
      </div>
    </header>

    <section id="quiz-screen" class="card">
      <h2 id="question-text">Loading question...</h2>
      <form id="options-form" class="options"></form>

      <div class="actions">
        <button id="submit-btn" type="submit" form="options-form" disabled>Submit Answer</button>
        <button id="next-btn" type="button" class="secondary hidden">Next Question</button>
      </div>

      <div id="feedback" class="feedback hidden"></div>
    </section>

    <section id="result-screen" class="card hidden">
      <h2>Quiz Complete!</h2>
      <p id="final-score" class="final-score"></p>
      <p id="final-message"></p>

      <form id="save-score-form" class="save-score">
        <input id="player-name" type="text" placeholder="Your name for leaderboard" maxlength="24" required />
        <button type="submit">Save Score</button>
      </form>

      <div class="leaderboard-box">
        <h3>Leaderboard</h3>
        <ol id="leaderboard-list"></ol>
      </div>

      <button id="restart-btn" type="button" class="secondary">Play Again</button>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
